name: moneymate
description: A private, offline-first personal finance tracker.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.12.0
dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.0.0
  fl_chart: ^1.2.0
  intl: ^0.20.2
  sqflite: ^2.4.2
  sembast: ^3.8.7
  sembast_web: ^2.4.0
  path_provider: ^2.1.5
  file_selector: ^1.0.4
  web: ^1.1.1
  crypto: ^3.0.8
  llamadart: 0.19.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
hooks:
  user_defines:
    llamadart:
      llamadart_native_runtimes: [llama_cpp]
      llamadart_native_backends:
        platforms:
          android-arm64:
            backends: [cpu]
            cpu_profile: compact
          android-x64:
            backends: [cpu]
