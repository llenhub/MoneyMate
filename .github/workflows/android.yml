name: Android release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -eu
          : "${ANDROID_KEYSTORE:?Missing release keystore}" "${ANDROID_STORE_PASSWORD:?Missing store password}"
          : "${ANDROID_KEY_ALIAS:?Missing key alias}" "${ANDROID_KEY_PASSWORD:?Missing key password}"
          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/moneymate.jks"
          python3 - <<'PY'
          import os
          from pathlib import Path

          def escape(value):
              return value.replace("\\", "\\\\").replace("\n", "\\n").replace("\r", "\\r").replace(" ", "\\ ")

          props = {
              "storeFile": os.path.join(os.environ["RUNNER_TEMP"], "moneymate.jks"),
              "storePassword": os.environ["ANDROID_STORE_PASSWORD"],
              "keyAlias": os.environ["ANDROID_KEY_ALIAS"],
              "keyPassword": os.environ["ANDROID_KEY_PASSWORD"],
          }
          Path("android/key.properties").write_text(
              "".join(f"{k}={escape(v)}\n" for k, v in props.items()), encoding="utf-8"
          )
          PY
      - name: Build signed ARM64 APK
        run: |
          flutter build apk --release --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk "MoneyMate-${GITHUB_REF_NAME}-android-arm64.apk"
          sha256sum "MoneyMate-${GITHUB_REF_NAME}-android-arm64.apk" > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "MoneyMate-${GITHUB_REF_NAME}-android-arm64.apk" SHA256SUMS.txt \
            --verify-tag --generate-notes
